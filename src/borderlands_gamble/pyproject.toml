[project]
name = "borderlands_gamble"
version = "0.2.0"
authors = [{ name = "leepettigrew" }]
description = """\
Adds slot machines to Borderlands 4. Walk up to any vending machine and pull the lever to gamble \
cash or eridium for more cash, eridium, and real loot from the game's own item pools.\
"""

[tool.sdkmod]
name = "Borderlands Gamble"
version = "0.2.0"
supported_games = ["BL4"]
coop_support = "RequiresAllPlayers"
